[tool.poetry]
name = "caikit-tgis-serving"
version = "0.0.1"
description = ""
authors = ["Daniele Trifirò <dtrifiro@redhat.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
caikit = "0.28.1"
caikit-nlp = "0.5.14"
caikit-tgis-backend = "0.1.39"
# Keep protobuf on the 4.x line that grpcio/caikit are built against.
# fastapi >= 0.162 drags protobuf 6 via its opentelemetry chain.
protobuf = ">=4.25.8,<5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"